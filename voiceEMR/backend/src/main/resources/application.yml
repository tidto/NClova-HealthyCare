spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voice_emr}
    username: ${DB_USER:voice_emr}
    password: ${DB_PASSWORD:voice_emr}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    provider: ${AI_PROVIDER:rule-based}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
